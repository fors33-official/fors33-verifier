name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Git tag and pyproject version with leading v (example: v0.12.0). Bare X.Y.Z is rejected.'
        required: true
        type: string

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fors33-verifier
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Set version
        id: meta
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "Version input is required."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9] ]]; then
            echo "Version must be vX.Y.Z (leading v required). Got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.meta.outputs.version }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Check pyproject version
        env:
          WANT_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          want = os.environ["WANT_VERSION"]
          with open("pyproject.toml", "rb") as handle:
              got = tomllib.load(handle)["project"]["version"]
          if got != want:
              print(f"pyproject.toml version {got!r} != {want!r}", file=sys.stderr)
              sys.exit(1)
          print(f"version ok: {got}")
          PY

      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build

      - name: Attest
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.version }}" \
            dist/*.whl dist/*.tar.gz \
            "${{ steps.attest.outputs.bundle-path }}" \
            --title "${{ steps.meta.outputs.version }}" \
            --notes "See CHANGELOG.md for this tag."
