# Fors33 Verifier — verify data integrity in CI/CD.
# Fails the job (exit 1) on hash mismatch or tree drift. Zero-trust; no file uploads to this action.
name: 'Fors33 Verifier'
description: 'Verify a file or URL against SHA-256, or a directory tree with --mode auto/sidecars. Fails the job on mismatch or drift.'
branding:
  icon: shield-check
  color: blue
inputs:
  url:
    description: 'HTTPS URL to download and verify (presigned URL). Do not use for sensitive data.'
    required: false
  file:
    description: 'Path to local file (in runner) to verify'
    required: false
  expected-hash:
    description: 'Expected SHA-256 hex digest. Required for file/URL hash mode. Omit when using mode + root.'
    required: false
  record:
    description: 'Path to attestation record JSON (overrides start/end/hash when provided)'
    required: false
  start:
    description: 'Start byte offset for segment verification'
    required: false
  end:
    description: 'End byte offset for segment verification'
    required: false
  mode:
    description: 'CLI --mode: single (default), auto, sidecars, manifest, bagit, checksum_manifest'
    required: false
  root:
    description: 'CLI --root directory for auto/sidecars/manifest/bagit/checksum_manifest'
    required: false
# Exit code: 0 = verified, 1 = mismatch or drift (fails job), 2 = error. No outputs from container.
runs:
  using: 'docker'
  image: 'docker://ghcr.io/fors33-official/fors33-verifier:v0.10.1'
